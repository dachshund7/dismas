# cargo deny check advisories, which the Advisories workflow runs: the
# crates in Cargo.lock against the RustSec advisory database. Only the
# advisories are checked; the licenses and the sources of the crates are
# left to review
[advisories]
# A crate no longer maintained only fails the check if Dismas depends on
# it itself; for the crates of its dependencies, it's up to them
unmaintained = "workspace"
# An advisory that doesn't apply to Dismas goes here, with the reason
ignore = []

# Only the crates built for the systems the code builds on are checked, so
# an advisory about a crate that only Windows, macOS or WebAssembly builds
# use (winapi, objc, wasm-bindgen) doesn't fail the daily check. FreeBSD is
# among them, as the code has its cases, and glycin decodes images in the
# process there (its sandboxed loaders are for Linux only), so the image
# decoders it then uses, which read untrusted covers, are checked too
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-freebsd",
]
