include:
  - project: 'gnome/citemplates'
    file: 'flatpak/flatpak-ci-initiative-sdk-extensions.yml'
    # ref: ''
  - component: "gitlab.gnome.org/GNOME/citemplates/basic-release-with-dist@25.4"
    inputs:
      dist-job-name: "flatpak"

stages:
  - check
  - test
  - deploy

flatpak:
  extends: ".flatpak"
  variables:
    APP_ID: "io.bassi.Amberol.Devel"
    BUNDLE: "io.bassi.Amberol.Devel.flatpak"
    FLATPAK_MODULE: "amberol"
    MANIFEST_PATH: "io.bassi.Amberol.json"
    RUNTIME_REPO: "https://nightly.gnome.org/gnome-nightly.flatpakrepo"

rust-fmt:
  image: "rust:slim"
  stage: "check"
  needs: []
  script:
    - rustup component add rustfmt
    - echo -e "" > src/config.rs
    - rustc -Vv && cargo -Vv
    - cargo --version
    - cargo fmt --all -- --check

rust-clippy:
  image: fedora:latest
  stage: "check"
  needs: []
  before_script:
    - >-
      dnf install -y cargo clippy gcc pkgconf-pkg-config
      gtk4-devel libadwaita-devel sqlite-devel libseccomp-devel fontconfig-devel
      gstreamer1-devel gstreamer1-plugins-base-devel
      gstreamer1-plugins-bad-free-devel
  script:
    # Clippy has to compile the crate, so config.rs needs real constants
    - sed 's/@[A-Z_]*@/""/' src/config.rs.in > src/config.rs
    - cargo clippy --version
    - cargo clippy --all-targets -- -D warnings

reuse:
  image: fedora:latest
  stage: "check"
  needs: []
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
    - dnf install -y python3-pip
  script:
    - pip install --user reuse
    - reuse lint
