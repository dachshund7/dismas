name: Release

# A Flatpak of the regular profile, dismas.flatpak, and a prebuilt tarball
# for distributions without Flatpak, dismas-<version>-x86_64.tar.xz.
# Pushing a version's tag builds both and puts them in a draft release, with
# the version's section of the change log as its notes, which is checked and
# published by hand: a published release can be immutable, and files can't
# be added to it then. Run by hand, it only builds them, in the artifacts of
# the run, to try them before a release
on:
  push:
    tags: ['20*']
  workflow_dispatch:

permissions:
  contents: read

# Two pushes of a tag build one after the other, rather than racing to make
# its draft
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# As the draft job can write to the repository, the actions are pinned to
# commits, which a tag moved to other code can't change; the comments name
# the releases they are. The checkouts don't keep the token in .git, where
# the code a build runs could read it

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      # As in ci.yml, the runner's disk is too small for the SDK and the
      # build, so the biggest of its preinstalled tools, which this job
      # doesn't use, are mounted to be removed
      volumes:
        - /usr/local/lib/android:/host/android
        - /usr/share/dotnet:/host/dotnet
        - /opt/hostedtoolcache:/host/toolcache
        - /opt/ghc:/host/ghc
    steps:
      - name: Free disk space
        run: |
          df -h /__w
          rm -rf /host/android/* /host/dotnet/* /host/toolcache/* /host/ghc/*
          df -h /__w

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bundle is built from its sources alone, without the action's
      # cache of .flatpak-builder: that cache would be restored from the
      # runs of ci.yml on main, and carries over what they built, so a
      # crate or an action that had been changed in one of them, and was
      # dropped or updated since, could still be in the release's bundle.
      # cache: false neither restores nor saves it, and restore-cache: false
      # turns the restoring off as well, in case the action reads it alone.
      # The action uploads the bundle in the artifacts of the run
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.dachshund7.Dismas.json
          bundle: dismas.flatpak
          cache: false
          restore-cache: false

  # The binary links the system's libraries, so it's built on Fedora, as in
  # ci.yml, in the same release of it; make-tarball.sh fails if it needs a
  # newer glibc than the distributions with GNOME 49's libraries have
  tarball:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      # desktop-file-utils has update-desktop-database, which Meson looks for
      # at setup (gnome.post_install in meson.build), even though it doesn't
      # run it for an install into a staging folder
      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc meson ninja-build rust cargo
          gtk4-devel libadwaita-devel
          gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-bad-free-devel
          blueprint-compiler gettext glib2-devel sqlite-devel libseccomp-devel fontconfig-devel
          desktop-file-utils binutils xz tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the tarball
        run: build-aux/make-tarball.sh _build-tarball dist

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dismas-tarball
          path: dist/*.tar.xz
          if-no-files-found: error

  # The only job that can write to the repository. The builds run the code
  # of every crate, its build scripts and macros, so they get a token that
  # only reads; this job runs none of the repository's code, only gh and
  # GitHub's own actions, to put what they built in a draft release
  draft:
    if: github.event_name == 'push'
    needs: [flatpak, tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The notes are the change log's section for the version (an rc's are
      # its version's), read from the tagged commit through the API, which
      # runs none of the repository's code
      - name: Take the notes from the change log
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GH_REPO/contents/CHANGES.md?ref=$TAG" > changes.md
          awk -v v="${TAG%%-*}" '
            /^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next }
            !found { next }
            /^[[:space:]]*$/ { if (started) blank++; next }
            { while (blank) { print ""; blank-- }; started = 1; print }
          ' changes.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGES.md has no section for ${TAG%%-*}"
            exit 1
          fi

      # A re-run puts the files in the draft it made before, and stops at a
      # release that was published
      - name: Make the draft release
        run: |
          shopt -s failglob
          files=(dist/*.flatpak dist/*.tar.xz)
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is published already"
              exit 1
            fi
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            gh release create "$TAG" --draft --verify-tag --notes-file notes.md \
              --title "Dismas $TAG" "${files[@]}"
          fi
