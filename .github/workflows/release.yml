name: Release

# A Flatpak of the regular profile, attached to each release published on
# GitHub as dismas.flatpak. Run by hand, it builds the bundle without
# attaching it anywhere, in the artifacts of the run, to try the build
# before a release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# As this workflow can write to the repository, its actions are pinned to
# commits, which a tag moved to other code can't change; the comments name
# the releases they are

jobs:
  flatpak:
    runs-on: ubuntu-latest
    # Attaching the bundle to the release writes to the repository
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      # As in ci.yml, the runner's disk is too small for the SDK and the
      # build, so the biggest of its preinstalled tools, which this job
      # doesn't use, are mounted to be removed
      volumes:
        - /usr/local/lib/android:/host/android
        - /usr/share/dotnet:/host/dotnet
        - /opt/hostedtoolcache:/host/toolcache
        - /opt/ghc:/host/ghc
    steps:
      - name: Free disk space
        run: |
          df -h /__w
          rm -rf /host/android/* /host/dotnet/* /host/toolcache/* /host/ghc/*
          df -h /__w

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.dachshund7.Dismas.json
          bundle: dismas.flatpak

      - name: Attach the bundle to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dismas.flatpak
          fail_on_unmatched_files: true
