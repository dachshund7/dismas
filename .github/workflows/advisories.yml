name: Advisories

# The crates in Cargo.lock against the RustSec advisory database, with
# deny.toml, and the workflows against zizmor's audits. A new advisory can
# fail either without a change to the code, so besides the changes to the
# lockfile, the settings and the workflows, it checks main every day
on:
  push:
    branches: [main]
    paths: [Cargo.lock, deny.toml, '.github/workflows/**']
  pull_request:
    paths: [Cargo.lock, deny.toml, '.github/workflows/**']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml, the actions are pinned to commits, which a tag moved to
# other code can't change, as the runs on main can save to its cache; the
# comments name the releases they are. The checkout doesn't keep the token
# in .git

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny

      - name: Check the dependencies for advisories
        run: cargo deny check advisories

  # zizmor checks what the workflows do, such as their permissions, their
  # checkouts and the images they run in, and asks GitHub's API about each
  # pinned action, with the job's token, which only reads: that its commit
  # is the release its comment names, that the commit is in the action's
  # own repository rather than a fork, whose commits GitHub also finds
  # under the parent's name, and that the release has no advisory. A clean
  # run doesn't look inside the actions or the images, nor know every
  # action's cache (release.yml's Flatpak build turns flatpak-builder's off
  # for a reason zizmor doesn't check)
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: zizmor

      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows/
