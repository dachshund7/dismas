name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code
permissions:
  contents: read

# A new push to a branch cancels the run of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# As in release.yml, the actions are pinned to commits, which a tag moved
# to other code can't change, as the jobs on main can save to its cache;
# the comments name the releases they are. Update both workflows together

jobs:
  # Formatting, spelling, POTFILES.in, the order of the resources and
  # licensing; none of these needs the app to build
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned, it takes the toolchain from its input rather than its ref
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: typos

      # rustfmt needs the module to exist, but not its contents, which
      # meson setup generates; it takes a file with a blank line, but
      # wants to change an empty one
      - name: Create a placeholder config.rs
        run: echo > src/config.rs

      - name: Run checks.sh
        run: build-aux/checks.sh

      - name: Check licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # The crates in Cargo.lock against the RustSec advisory database, with
  # deny.toml; a new advisory can fail it without a change to the code
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny

      - name: Check the dependencies for advisories
        run: cargo deny check advisories

  # The build of the app, clippy, the unit tests, and the validation of the
  # desktop file, the metainfo and the settings schema. The app needs a
  # newer GTK and libadwaita than Ubuntu has, so these run in Fedora
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc meson ninja-build rust cargo clippy
          gtk4-devel libadwaita-devel
          gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-bad-free-devel
          gstreamer1-plugins-good
          blueprint-compiler gettext glib2-devel sqlite-devel libseccomp-devel fontconfig-devel
          desktop-file-utils appstream shared-mime-info

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Generates src/config.rs, which Cargo needs
      - name: Configure
        run: meson setup _build

      # The release build, with the templates and the resources, as it's
      # installed; meson test would build it anyway, but a failure would
      # then show up under the validation
      - name: Build
        run: meson compile -C _build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Validate the desktop file, metainfo and schema
        run: >
          meson test -C _build --print-errorlogs
          "Validate desktop file" "Validate appstream file" "Validate schema file"

  # A Flatpak of the development profile, for trying a change without
  # building it; the bundle is in the artifacts of the run
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      # The runner's disk is too small for the SDK and the build, so the
      # biggest of its preinstalled tools, which this job doesn't use,
      # are mounted to be removed
      volumes:
        - /usr/local/lib/android:/host/android
        - /usr/share/dotnet:/host/dotnet
        - /opt/hostedtoolcache:/host/toolcache
        - /opt/ghc:/host/ghc
    steps:
      - name: Free disk space
        run: |
          df -h /__w
          rm -rf /host/android/* /host/dotnet/* /host/toolcache/* /host/ghc/*
          df -h /__w

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.dachshund7.Dismas.Devel.json
          bundle: dismas-devel.flatpak
