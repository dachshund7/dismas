version = 1
SPDX-PackageName = "dismas"
SPDX-PackageSupplier = "John Hamilton"
SPDX-PackageDownloadLocation = "https://github.com/dachshund7/dismas"

[[annotations]]
path = ".gitignore"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "Cargo.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["README.md", "CONTRIBUTING.md", "CHANGES.md", "RELEASING.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "CLAUDE.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026  John Hamilton"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["io.github.dachshund7.Dismas.json", "io.github.dachshund7.Dismas.Devel.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "data/io.github.dachshund7.Dismas.metainfo.xml.in.in"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "data/io.github.dachshund7.Dismas.desktop.in.in"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "data/io.github.dachshund7.Dismas.gschema.xml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "data/io.github.dachshund7.Dismas.service.in"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "data/screenshots/**.jpg"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026  John Hamilton"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# The app icons and the hearts were drawn for Dismas, and carry their own
# copyright and license; this entry comes after the one for all SVG files,
# so that it's the one that applies to them
[[annotations]]
path = ["data/icons/hicolor/scalable/apps/io.github.dachshund7.Dismas*.svg", "data/icons/hicolor/symbolic/apps/io.github.dachshund7.Dismas*.svg", "src/assets/icons/heart-*-symbolic.svg"]
precedence = "closest"
SPDX-FileCopyrightText = "2026  John Hamilton"
SPDX-License-Identifier = "CC-BY-SA-3.0"

[[annotations]]
path = ["po/POTFILES.in", "po/LINGUAS"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "po/**.po"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Translation authors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "src/dismas.gresource.xml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "src/gtk/**.blp"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "src/gtk/style.css"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022  Emmanuele Bassi"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "subprojects/blueprint-compiler.wrap"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025  Emmanuele Bassi"
SPDX-License-Identifier = "CC0-1.0"
