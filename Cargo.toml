[package]
name = "dismas"
authors = ["John Hamilton <jlhamilton@gmail.com>", "Emmanuele Bassi <ebassi@gnome.org>"]
version = "0.1.0"
edition = "2024"

[dependencies]
color-thief = "0.2.1"
glycin = { version = "4", features = ["gdk4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_16"] }
itertools = "0.14"
glib-unix = "0.22"
libc = "0.2"
lofty = "0.24"
log = "0.4"
mpris-server = "0.8"
pretty_env_logger = "0.5"
rand = { version = "0.10", features = ["thread_rng"] }
rusqlite = "0.40"
serde_json = "1.0"
sha2 = "0.10.2"
async-channel = "2.2.0"
futures = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = { version = "0.13", default-features = false, features = [
  "gtk4",
  "background",
  "async-io",
] }
gdk-x11 = { package = "gdk4-x11", version = "0.11" }
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
x11rb = "0.14"

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_5"]

[dependencies.gst]
package = "gstreamer"
version = "0.25"

[dependencies.gst-audio]
package = "gstreamer-audio"
version = "0.25"

[dependencies.gst-play]
package = "gstreamer-play"
version = "0.25"

# Some lints from the pedantic group, whose fixes are mechanical
[lints.clippy]
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"
manual_let_else = "warn"
redundant_else = "warn"
if_not_else = "warn"
single_match_else = "warn"
map_unwrap_or = "warn"
cast_lossless = "warn"
